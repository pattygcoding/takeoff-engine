<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="shortcut icon" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takeoff Engine — Civil &amp; Utility Estimating Platform</title>

    <!--
      Route metadata (title, description, keywords, canonical, OpenGraph, Twitter, hreflang and
      JSON-LD) is owned by SeoHead / react-helmet-async so there is a single source of truth.
      The <title> above is a default for the brief window before the app mounts and for non-JS
      crawlers hitting a non-prerendered route; SeoHead replaces it and headMetadata de-duplicates
      the pair. Build-time prerendering
      (`npm run prerender`) bakes SeoHead's output into the public routes' raw HTML.
    -->

    <!-- Single Page App redirect restore for GitHub Pages custom domain routing -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('takeoff_engine_theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
