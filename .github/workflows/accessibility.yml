name: Accessibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Use the lockfile-pinned local Playwright CLI instead of `npx`, so no package is
      # downloaded on demand and no install-time lifecycle scripts run (Sonar S6505 / S8543).
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: accessibility-failures
          path: test-results/
          retention-days: 14