name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # typescript/no-explicit-any (see .oxlintrc.json) fails the build on any explicit `any`.
      - run: npm run lint
      # tsc --noEmit; tsconfig enables `strict`, which includes noImplicitAny.
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # node:test suites: validation, architecture boundary, API clients, shared helpers.
      - run: npm run test
      # vitest + jsdom suites: React components, contexts, and pricing state.
      - run: npm run test:unit

  # NOTE: `npm run test:parsing` is deliberately not wired up here.
  # tests/parsing/sampleSpreadsheets.spec.ts imports the parser as
  # '../../../takeoff-engine-backend/src/product/services/csvParser.service.ts', i.e. from a
  # directory *above* this repo root, so it can never resolve from a frontend-only checkout
  # (actions/checkout cannot place a repo outside $GITHUB_WORKSPACE, and the backend repo is
  # private so reading it from here would need a PAT). tsconfig.json excludes tests/parsing for the
  # same reason, which is what keeps `npm run typecheck` working above.
  # The suite runs in the backend repo's CI instead (`parsing-tests` job), which checks this repo
  # out as a sibling. Run it locally too — the local monorepo layout already satisfies the import.

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Use the lockfile-pinned local Playwright CLI instead of `npx`, so no package is
      # downloaded on demand and no install-time lifecycle scripts run (Sonar S6505 / S8543).
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      # The config boots the Vite dev server on :4176 and drives it in Chromium.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 14
