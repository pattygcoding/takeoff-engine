name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typescript/no-explicit-any (see .oxlintrc.json) fails the build on any explicit `any`.
      - run: npm run lint
      # tsc --noEmit; tsconfig enables `strict`, which includes noImplicitAny.
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # node:test suites: validation, architecture boundary, API clients, shared helpers.
      - run: npm run test
      # vitest + jsdom suites: React components, contexts, and pricing state.
      - run: npm run test:unit

  parsing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Drives the real backend CsvParserService over the sample spreadsheets.
      # playwright.parsing.config.ts declares no browser fixtures, so no browser download is needed.
      - run: npm run test:parsing

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The config boots the Vite dev server on :4176 and drives it in Chromium.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 14
